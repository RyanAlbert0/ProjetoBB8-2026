<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamban - BB8</title>
</head>
<body>
    <main>
        <div id="sidePannel">
            <div class="title">
                <img src="" alt="">
            </div>
            <div class="content">
                <button class="selectButton" onclick="selectTab(0)">A Fazer</button>
                <button class="selectButton" onclick="selectTab(1)">Fazendo</button>
                <button class="selectButton" onclick="selectTab(2)">Feito</button>
                <button class="selectButton" onclick="selectTab(3)">Ideias</button>
            </div>
        </div>
        <div id="centerPannel">
            <div class="title">
                <h1 id="titleTab">Kamban - A Fazer</h1>
            </div>
            <table id="data">
                <tr>
                    <td>
                        <input type="text" id="dataInput" placeholder="Insira aqui sua ideia">
                        <button onclick="addData()">Enviar</button>
                    </td>
                </tr>
            </table>
        </div>
    </main>

    <script>

        var table = document.getElementById('data')

        window.onload
        {
            const tabs = ['toDo', 'doing', 'done', 'ideas']
            tabs.forEach(element => {
                if(localStorage.getItem(element) == ('' || null))
                {
                    localStorage.setItem(element, '')
                }
            });
            sessionStorage.setItem('tab', 'toDo')
            selectTab('toDo')
        }

        

        function selectTab(tab)
        {
            const title = document.getElementById('titleTab')

            table.innerHTML = ''
            const defaultData = document.createElement('tr')

            var input = document.createElement('input')
            input.placeholder = 'Insira o dado aqui'
            input.id = 'dataInput'
            input.addEventListener('keydown', (event) =>
            {
                const keyname = event.key
                if(keyname === 'Enter')
                {
                    addData()
                }

            }
            )


            var addDataBTN = document.createElement('button')
            addDataBTN.textContent = "Enviar"
            addDataBTN.addEventListener('click', addData)

            array = [input, addDataBTN]
            
            array.forEach(element => defaultData.appendChild(element));

            table.appendChild(defaultData)

            switch (tab)
            {
                case 0:
                {
                    title.textContent = "Kamban - A Fazer"
                    sessionStorage.setItem('tab', 'toDo')
                    loadData()
                    break
                }

                case 1:
                {
                    title.textContent = "Kamban - Fazendo"
                    sessionStorage.setItem('tab', 'doing')
                    break
                }

                case 2:
                {
                    title.textContent = "Kamban - Feito"
                    sessionStorage.setItem('tab', 'done')
                    break
                }

                case 3:
                {
                    title.textContent = "Kamban - Ideias"
                    sessionStorage.setItem('tab', 'ideas')
                    break
                }
            }
        }

        function addData()
        {
            const dataInput = document.getElementById('dataInput').value
            const tab = sessionStorage.getItem('tab')
            console.log(dataInput.value)

            masterData = document.getElementById('data')

            if (dataInput == '')
            {
                console.log(`${dataInput} não é uma entrada válida`)
            }
            else
            {
                var index = JSON.parse(localStorage.getItem(tab)).length

                if(localStorage.getItem(tab) != '')
                {
                    var tempData = JSON.parse(localStorage.getItem(tab))
                    tempData.push(dataInput)
                    var data = JSON.stringify(tempData) 
                    localStorage.setItem(tab, data)
                    console.log('Os dados foram atualizados')
                }
                else
                {
                    var tempData = []
                    tempData.push(dataInput)
                    var data = JSON.stringify(tempData)
                    localStorage.setItem(tab, data)
                    console.log('Os dados foram criados')
                }


                appendData(dataInput, index, tab)

        }
        }
    
        function loadData()
        {

            tab = sessionStorage.getItem('tab')
            if(tab == '')
            {
                pass
            }
            else
            {
                var data = JSON.parse(localStorage.getItem(tab))
                
                data.forEach((tempData, index) => {

                    appendData(tempData, index, tab)

                });
            }
        }

        function clearItself(index)
        {
            tab = sessionStorage.getItem('tab')
            data = JSON.parse(localStorage.getItem(tab))
            data.splice(index, 1)
            localStorage.setItem(tab, JSON.stringify(data))

            info = document.getElementById(`info${index}`)
            info.remove()

        }

        function appendData(data, index, tab)
        {
            var info = document.createElement('tr')
            info.class = 'info'
            info.id = `info${index}`

            var text = document.createElement('p')
            text.textContent = data

            // DEBUG
            var debug = document.createElement('p')
            debug.id = index
            debug.textContent = `ID: ${index}` 
            // debug.style = 'display: none'

            var deleteBTN = document.createElement('button')
            deleteBTN.class = 'delBTN'
            deleteBTN.textContent = 'X'
            deleteBTN.addEventListener('click', event => { clearItself(index) })
            
            var child = [text, debug, deleteBTN]
            child.forEach(element => {info.appendChild(element)})

            table.appendChild(info)
            console.log('Data: ' + data + ' | Index: ' + index)

        }
    </script>
</body>
</html>
